name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # tsc -b 而不是 --noEmit:未用的匯入只有前者會擋下來
      - run: npm run build
      # 跑覆蓋率而不是光跑測試 —— vite.config.ts 訂了一道只准往上的門檻。
      # 這一步同時是「測試有沒有全過」和「有沒有整塊沒人管的程式碼」兩件事
      - run: npm run coverage
