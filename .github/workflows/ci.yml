name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # tsc -b 而不是 --noEmit:未用的匯入只有前者會擋下來
      - run: npm run build
      - run: npx vitest run
